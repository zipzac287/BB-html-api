<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩸 Ngân hàng máu</title>
  <link rel="stylesheet" href="index1.css" />
</head>
<body>
<div class = "toast-container" id="toast-container"></div>
  
<div class = "auth-page" id="page-login">
  <div class = "auth-card">
    <div class = "auth-logo" id="auth-logo">
        <div class = "auth-icon" id="auth-icon">🩸</div>
        <div class = "auth-title" id="auth-title">BloodBank Management</div>
        <div class = "auth-subtitle" id="auth-subtitle">Hệ thống quản lý ngân hàng máu</div>
    </div>
      <h2>Đăng nhập</h2>
      <div id="alert1" class="alert alert-error"></div>
      <div class="form-group", style = "margin : 20 px">
        <label>Username</label>
        <input type="text" id="username-login" placeholder="Nhập username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password-login" placeholder="Nhập password" />
      </div>
      <button class="btn btn-primary" style="width: 100%; margin: 20px auto;"  onclick="login('container')" id="btn-login">Đăng nhập</button> 
      <div class = "auth-footer">
        Chưa có tài khoản?
        <a href="#" onclick="showAuth('page-register')">Tạo tài khoản</a>
      </div>
    </div>
</div>

<div class = "auth-page" id="page-register">
  <div class="auth-card" >
    <div class = "auth-logo" id="auth-logo">
        <div class = "auth-icon" id="auth-icon">🩸</div>
        <div class = "auth-title" id="auth-title">BloodBank Management</div>
        <div class = "auth-subtitle" id="auth-subtitle">Hệ thống quản lý ngân hàng máu</div>
      </div>
    <h2>Đăng ký tài khoản</h2>
    <div class = "form-group">
      <label>Tên tài khoản</label>
      <input type ="text" id="user-register" placeholder="Nhập số user" />
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password-register" placeholder="Nhập mật khẩu" />
    </div>
    <div class="form-group">
      <label>Nhập mã số NV:</label>
      <input class="numeric" id="ms-register" placeholder="Nhập MSNV" />
    </div>
    <button class="btn btn-primary" style="width: 50%;margin: 20px auto;" onclick="register()" id="btn-register">Đăng ký tài khoản</button>
    <button class="btn btn-primary" style="width: 50%;margin: 20px auto;" onclick="showAuth('page-login')" id="btn-back-register">Quay về</button>
  </div>
</div>
<!-- menu page-->
<div class="menu hien">
  <div class = "side-bar" id = "side-bar">
    <div class= "menu-logo">
      <div class = "menu-icon" id="menu-icon">🩸</div>
      <div class = "menu-title">Blood Bank</div>
      <div class = "menu-subtitle">Management System</div>
    </div>
    <div class = "kho1" id = "kho-tho">
      <h4> Quản lý kho thô </h4>
      <button class = "btn1 nhaptt" onclick="showpage()">📦 Nhập trực tiếp</button>
      <button class = "btn1 ct-tho" onclick="showpage()">✂ Chiết tách</button>
      <button class = "btn1 slmau" onclick="showpage()">💉 Sàng lọc máu</button>
      <button class = "btn1 huy-tho" onclick="showpage()">🗑 Hủy phế thải</button>
    </div>
    <div class = "kho1" id = "kho-sach">
      <h4> Quản lý kho sạch </h4>
      <button class = "btn1 nhapks" onclick="showpage()">📦 Nhập kho sạch</button>
      <button class = "btn1 nhaptt2" onclick="showpage()">💊 Nhập trực tiếp </button>
      <button class = "btn1 ct-sach" onclick="showpage()">✂ Chiết tách</button>
      <button class = "btn1 xmsach" onclick="showpage()">📤 Xuất máu</button>
      <button class = "btn1 huy-sach" onclick="showpage()">🗑 Hủy kho sạch</button>
    </div>
    <div class = "kho1" id = "benhnhan">
      <h4> Quản lý bệnh nhân </h4>
      <button class = "btn1 nhapbn" onclick="showpage()">📦 Nhập bệnh nhân</button>
      <button class = "btn1 yeucaumau" onclick="showpage()">💊 Yêu cầu máu </button>
      <button class = "btn1 thongkebn" onclick="showpage()">📋 Thống kê</button>
      
    </div>
  </div>
  <div class = "win1 active" id="menu1">
    <div class = "win2">
    <div class="hang-menu">
    <div class="form-group2">
    <label>Mã số người hiến</label>
    <input type="text" id="ms-nh" placeholder="Nhập MS người hiến máu" />
    <button class = "btn" onclick="findms()">Tìm thông tin</button>
    </div>
  </div>
  <div class="hang-menu">
    <div class="form-group2">
    <label>Họ và tên</label>
    <input type="text" id="hoten-nhm"/>
    <label>Năm sinh</label>
    <input type="date" id="ngaysinh-nhm"/>
    <label>Giới tính</label>
    <select name="sex">
      <option value="nam">Nam</option>
      <option value="nu">Nữ</option>
    </select>
    <label>Nhóm máu</label>
    <select name="abo">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="O">O</option>
      <option value="AB">AB</option>
    </select>
    <label>RhD</label>
    <select name="rhd">
      <option value="+">+</option>
      <option value="-">-</option>
    </select>
    </div>
  </div>
  <div class="hang-menu">
    <div class="form-group2">
    <label>Địa chỉ</label>
    <input type="text" id="diachi-nhm"/>
    <label>SĐT</label>
    <input type="number" id="sdt-nhm"/>
    <label>Email</label>
    <input type="email" id="email-nhm"/>

    </div>
  </div>
  <div class="hang-menu">
    <div class="form-group2">
      <label>Ghi chú</label>
      <input type="text" style = " width: 500px;" />
  </div>
  </div>
  <div class="hang-menu" style=" gap: 50px; padding: 50px auto;">
    <button class="btn" onclick="luuttnhm()">Lưu thông tin</button>
    <button class="btn" onclick="xoattnhm()">Xóa thông tin</button>
    <button class="btn" onclick="capnhatttnhm()">Cập nhật thông tin</button>
  </div>
</div>
<div class = "win2">
  <div class="hang-menu">
    <div class="form-group2">
      <label>Mã số túi máu</label>
      <input type ="text" id="mstm" placeholder="Mã số túi máu" />
    </div>
    <button class ="btn" onclick="timtuimau1()">Tìm túi máu</button>
  </div>
  <div class="hang-menu">
    <label>Ngày hiến</label>
    <input type ="date" id="ngayhien-tm"/>
    <label>ABO</label>
    <input type = "text" id="abo-tm" style = "width: 20px" />
  </div>
</div>
</div>
</body>
<script>
function showAuth(pageId) {
  document.querySelectorAll('.auth-page').forEach(p => p.classList.remove('active'));
  document.getElementById(pageId).classList.add('hien');
}
function showpage(pageId) {
  document.querySelectorAll('.kho1').forEach(p => p.classList.remove('hien'));
  document.getElementById(pageId).classList.add('hien');
}
function login(pageId) {
  const loginpage = document.getElementById('page-login');
  const menupage = document.querySelector('.menu');

  loginpage.classList.remove('active');
  menupage.classList.add('hien');
}
</script>
