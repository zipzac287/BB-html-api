<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🩸 Ngân hàng máu</title>
  <link rel="stylesheet" href="index1.css" />
</head>
<body>
<div class = "toast-container" id="toast-container"></div>
  
<div class = "container">
  <div id="login" class="page-login">
    <div class = "auth-card" id="auth-card" style = "max-width: 420px; margin : 60px auto;">
      <div class = "auth-logo" id="auth-logo">
        <div class = "auth-icon" id="auth-icon">🩸</div>
        <div class = "auth-title" id="auth-title">BloodBank Management</div>
        <div class = "auth-subtitle" id="auth-subtitle">Hệ thống quản lý ngân hàng máu</div>
      </div>
      <h2>Đăng nhập</h2>
      <div id="alert1" class="alert alert-error"></div>
      <div class="form-group">
        <label>Username</label>
        <input type="text" id="username-login" placeholder="Nhập username" />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password-login" placeholder="Nhập password" />
      </div>
      <button class="btn btn-primary" style="width: 100%" onclick="login()" id="btn-login">Đăng nhập</button> 
      <div class = "auth-footer">
        Chưa có tài khoản?
        <a href="#" onclick="showPage('page-register')">Tạo tài khoản</a>
      </div>
    </div>
  </div>
</div>
<div class = "auth-page" id="page-register">
  <div class="card" style = "max-width: 420px; margin: 60px auto;">
    <h2>Đăng ký tài khoản</h2>
    <div class = "form-group">
      <label>Tên tài khoản</label>
      <input type ="text" id="user-register" placeholder="Nhập số user" />
    </div>
    <div class="form-group">
      <label>Mật khẩu</label>
      <input type="password" id="password-register" placeholder="Nhập mật khẩu" />
    </div>
    <div class="form-group">
      <label>Nhập mã số NV:</label>
      <input class="numeric" id="ms-register" placeholder="Nhập MSNV" />
    </div>
    <button class="btn-register" style="width: 100%;" onclick="register()" id="btn-register">Đăng ký tài khoản</button>
    <button class="btn-back" style="width: 100%;" onclick="showPage('page login')" id="btn-back-register">Quay về</button>
  </div>
</div>
<div class = "app-shell" id="app-shell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class = "logo-icon">🩸</div>
      <div class = "logo-text"> Blood Bank Management</div>
    </div>
    <span class = "nav-label">Menu</span>



  </aside>
  

  </div>
</div>
</body>
